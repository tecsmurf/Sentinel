name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: |
          RUFF_PIN=$(grep -E '^ruff==' requirements-dev.txt | awk '{print $1}')
          python -m pip install "${RUFF_PIN}"
      - run: ruff check .
      - run: ruff format --check .

  test-linux:
    # Platform-neutral unit and integration tests. Windows API and Qt GUI tests run on Windows.
    name: Tests (Ubuntu, platform-neutral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -m "not windows and not ui" --junitxml=test-results/junit-linux.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-linux
          path: test-results/
          if-no-files-found: ignore

  test-windows:
    name: Tests (Windows, full suite)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest --junitxml=test-results/junit-windows.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-windows
          path: test-results/
          if-no-files-found: ignore
